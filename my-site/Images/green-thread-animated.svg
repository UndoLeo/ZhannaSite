<svg width="100%" height="1000" viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Полупрозрачный белый фон -->
  <rect width="100%" height="100%" fill="rgba(255,255,255,0.95)" />
  
  <!-- Клубок (слева сверху) -->
  <circle cx="80" cy="80" r="50" fill="#3aab6b" opacity="0.9">
    <animate attributeName="r" values="50; 53; 50" dur="5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Реалистичная нить с 3 изгибами -->
  <path stroke="url(#thread-gradient)" stroke-width="4" fill="none" stroke-linecap="round"
        d="M80,80 
           C400,80 800,80 1100,80 
           C900,400 300,400 100,400 
           C400,700 800,700 1100,700">
    <animate attributeName="d" 
             values="M80,80 C400,80 800,80 1100,80 C900,400 300,400 100,400 C400,700 800,700 1100,700;
                    M80,80 C400,100 800,60 1100,80 C900,420 300,380 100,400 C400,680 800,720 1100,700"
             dur="10s" 
             repeatCount="indefinite" />
  </path>
  
  <!-- Эффекты -->
  <defs>
    <!-- Градиент для объёма нити -->
    <linearGradient id="thread-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a5c3a" />
      <stop offset="50%" stop-color="#3aab6b" />
      <stop offset="100%" stop-color="#2a5c3a" />
    </linearGradient>
    
    <!-- Тень для реалистичности -->
    <filter id="thread-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Текстура нити (повторяющиеся штрихи) -->
  <path d="M80,80 C400,80 800,80 1100,80" stroke="#ffffff" stroke-width="1" stroke-dasharray="1,3" opacity="0.3" />
  <path d="M100,400 C300,400 900,400 1100,400" stroke="#ffffff" stroke-width="1" stroke-dasharray="1,3" opacity="0.3" />
</svg>